[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hfpos"
version = "0.1.0"
description = "Unusual leveraged-fund positioning and U.S. Treasury futures"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not network'"
markers = [
    "network: hits a live CFTC endpoint; skipped by default, run with -m network",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
